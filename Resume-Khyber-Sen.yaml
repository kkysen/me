      - company: MediaTek
        position: Compiler Intern
        date:
        start_date: 2020-05
        end_date: 2021-12
        location: Woburn, MA
        summary:
        highlights:
          - 'If Conversion: Replaced monomorphic branch unswitching with polymorphic if
            conversion for significant code size savings with minimal performance impact.'
          - 'Little Doctor: Built the Little Doctor, a framework for testing the compiler''s
            debug info''s quality using gdb''s Python API, which already discovered hundreds
            of bugs in 2 months.'
          - 'Louper: Helped optimize MediaTek''s LLVM-based digital signal processing compiler
            by using deep learning to predict difficult optimization decisions. Developed the
            hyperheuristic framework Louper, which created a register pressure estimator 3x as
            accurate as the current human heuristic.'
      - company: Columbia University
        position: 'Teaching Assistant, Analysis of Algorithms (taught by Prof. Clifford Stein)'
        date:
        start_date: 2019-09
        end_date: 2019-12
        location:
        summary:
        highlights:
          - Acted as liaison between professor and students.
          - Graded exams and problem sets for a class of 140 students.
          - Taught students during office hours and answered email questions throughout the week.
      - company: Columbia University
        position: Smart Neural Fuzzer Intern
        date:
        start_date: 2019-01
        end_date: 2019-08
        location:
        summary:
        highlights:
          - '[github.com/kkysen/SmartNeuralFuzzer](https://github.com/kkysen/SmartNeuralFuzzer)'
          - Developed a code coverage tool that records all the decisions (branches) a
            potentially multi-threaded, multi-process program makes, which allows for time
            travel and record-replay debugging of control flow. Collaborated with Kexin Pei and
            Junfeng Yang to integrate this decision data into a neural net that can intelligently
            guide fuzzing, taint analysis, and profile-guided optimizations, helping to uncover
            hidden data dependencies and elusive bugs. Written in modern C++17 as an LLVM
            optimization pass.
      - company: Columbia University
        position: Fruit Fly Brain Observatory Intern
        date:
        start_date: 2017-06
        end_date: 2017-08
        location:
        summary:
        highlights:
          - Built a robot to model the fruit fly vision system and its motion detection
            capabilities using massively parallel programming (under the direction of Aurel
            Lazar).
    projects:
      - name: '[Change Journal at Codeprentice](https://github.com/codeprentice-org/fanotify)
          (Rust)'
        date:
        start_date: 2022-05
        end_date: 2022-08
        location:
        summary:
        highlights:
          - Leading a 5-person team at Codeprentice on the Change Journal project. We are
            developing a cross-platform change journal library in Rust, using the fanotify
            backend on Linux and the USN journal backend on Windows we're writing. Ultimately
            we plan to use the change journal to create an instantaneous and cross-platform
            file searcher application. I have also helped teach my teammates Rust.
      - name: '[N Queens](https://github.com/kkysen/MKS22X/blob/master/02NQueens/NQueens.java)
          (Java)'
        date:
        start_date:
        end_date:
        location:
        summary:
        highlights:
          - Developed a novel, extremely efficient bitwise solution to the classic N Queens
            problem faster than any other known software solution.
      - name: '[Flight Delay Visualizer](https://github.com/kkysen/r3d3) (TypeScript,
          WebAssembly (C++17), d3)'
        date:
        start_date:
        end_date:
        location:
        summary:
        highlights:
          - Designed an interactive website to visualize all 6 million flights over the US in
            the past year, watching how certain airlines and airports are chronically delayed,
            and applying complex filters to the flights. Used C++ compiled to WebAssembly to
            make it feasible performance- and memory-wise.
      - name: '[Weather or Not at Stuy Hacks](https://github.com/wertylop5/WeatherOrNot) (JS)'
        date:
        start_date:
        end_date:
        location:
        summary:
        highlights:
          - Led a 4-person team in 24 hours, ~200-person Major League Hackathon. My team created
            a website that overlays maps, traffic, weather, and more to better plan your trip.
