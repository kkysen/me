    experience:
      - company: '[Effective Transit Alliance](https://www.etany.org/) (ETA)'
        logo: eta.svg
        position: '**Director of Transit Operations and Planning**'
        date:
        start_date: 2023-11
        end_date: present
        location: NYC
        summary:
        highlights:
          - Advocating for better transit in the NY metro area through technical analysis drawing
            from international best practices. Meeting with journalists, MTA staff, and
            elected officials. Researching and developing expertise in the latest advances in
            rolling stock, electrification, tunneling and station construction, service
            optimization, signaling, and automation.
          - text: 'Attended transit conferences across the world to learn best practices from peer
              cities:'
            highlights:
              - InnoTrans 2026 in Berlin
              - 10 TransportationCamps in NYC, Philadelphia, Boston, and DC
          - text: IBX (Project Manager)
            versions: [cv, general, transit]
            highlights:
              - '[IBX: 515 Feet from Greatness](https://www.etany.org/ibx-all-faiths-tunnel):
                advocated for an All Faiths Tunnel, prompting the MTA to abandon street-running and
                commit to a tunnel, increasing ridership by 35% and speed by 31%, and saving 3 years
                of riders'' time per day.'
              - text: '[Automated Light Metro is Right for the
                  IBX](https://www.etany.org/reports/ibx-automation): now that the IBX will be
                  fully grade-separated, it should be an ALM.'
                versions: [cv, transit]
          - text: 125 St Subway (Project Manager)
            versions: [cv, general, transit]
            highlights:
              - '[Digging Out of a Very Deep Hole: Saving Billions on 125th
                Street](https://www.etany.org/reports/digging-out-deep-hole-sas-west): how to
                build shallower stations that save riders up to 10 min per trip and the MTA
                billions by using the latest in subway construction techniques.'
              - text: '[Did NYC''s Newest Subway Just Get
                  Better?](https://www.youtube.com/watch?v=5FgyHCl6E3A): interviewed for a JTA
                  video.'
                versions: [cv, transit]
          - text: Rolling Stock and Electrification
            versions: [cv]
            highlights:
              - '[A Not-So-Capital Plan, Part 1: Perhaps the Most Expensive Subway Train in
                the World](https://www.etany.org/a-not-so-capital-plan-1-most-expensive-subway-train):
                how to stop the MTA''s subway rolling stock cost explosion.'
              - '[A Not-So-Capital Plan, Part 2: The Future is
                Electric](https://www.etany.org/not-so-capital-plan-the-future-is-electric): how to
                electrify affordably with catenary and tri-voltage trains.'
              - text: '[If It Can''t Stand the Heat, You Need to Upgrade the
                  Kitchen: Repairing the Northeast Corridor''s Electrical
                  Systems](https://www.etany.org/repairing-northeast-corridor-electrical-system)'
                versions: [cv, transit]
              - text: '[Baffling Battery Blunder: Expensive, Experimental, Slow Battery Locomotives
                  Have No Place on Already Electrified
                  Rails](https://www.etany.org/baffling-battery-blunder)'
                versions: [cv, transit]
          - text: Better Subway Service
            versions: [cv, general, transit]
            highlights:
              - '[Impeding Progress, Costing
                Riders](https://www.etany.org/statements/impeding-progress-costing-riders-opto):
                helped convince Governor Hochul to veto a 2025 bill that would have banned
                one-person train operation, preventing New York''s transit system from being
                locked out of future modernization.'
              - text: '[Deinterlining: Simpler Service, Fewer
                  Delays](https://www.etany.org/statements/deinterlining)'
                versions: [cv, transit]
          - text: Penn Station Through-Running
            highlights:
              - text: '[Penn Station Can Handle the
                  Load](https://www.etany.org/penn-station-can-handle-the-load): rebuilt the
                  passenger crowding model to show Penn Station can safely support 48 tph.'
                versions: [cv]
              - text: '[Penn Station Can Handle the
                  Load](https://www.etany.org/penn-station-can-handle-the-load): rebuilt the
                  passenger crowding model to show Penn Station can support 48 tph.'
                versions: [-cv]
              - text: '[Through-Running: First
                  Connections](https://www.etany.org/reports/through-running-first-connections):
                  a phased plan for through-running at Penn Station, using Metro-North''s Penn
                  Station Access as a launching pad.'
                versions: [cv, transit]
              - text: '[The Century Old Idea that Can Revolutionize NYC Commuter
                  Rail](https://www.youtube.com/watch?v=l0xR6V-GIzc): interviewed for a JTA
                  video.'
                versions: [cv, transit]
          - text: Fares
            versions: [cv]
            highlights:
              - '[Bring Back the Monthly: The Value of Affordable Transit
                Passes](https://www.etany.org/reports/monthly-passes): reasonably priced monthly
                passes encourage ridership, reduce fare evasion, and ease proof-of-payment fare
                collection.'
