      - company: '[Immunant](https://immunant.com/)'
        logo: immunant.png
        position:
          - text: '**Software Engineer** (previously Junior Software Engineer, Intern)'
            versions: [cv]
          - text: '**Software Engineer**'
        date:
        start_date: 2022-05
        end_date: 2026-04
        location: Remote
        summary:
        highlights:
          - text: '[c2rust](https://github.com/immunant/c2rust):
              Core developer of c2rust, a C to Rust transpiler, as part of the DARPA ALLSTAR and
              TRACTOR programs, helping to lift the unsafe Rust output to safe Rust through a
              combination of static and dynamic analysis.'
            highlights:
              - text: Integrated c2rust into [Hayroll](https://github.com/UW-HARVEST/Hayroll), a wrapper handling single-platform conditional
                  compilation, then extended both to handle cross-platform compilation, in part by
                  building off of zig cc.
                versions: [cv, software]
              - text: Added transpiler support for C constant macros, translating them as Rust constants,
                  and wrote c2rust-postprocess, reinserting comments lost by the transpiler using
                  LLMs. Added support for emitting edition 2024 code.
                versions: [cv, software]
              - text: Greatly strengthened testing, adding snapshot tests for the transpiler, reviving
                  c2rust-refactor and dynamic analysis, and extending the integration test suite of
                  various codebases.
                versions: [cv]
              - text: Wrote a rustc instrumentation plugin to dynamically trace pointer usage and
                  provenance throughout program runs, building a pointer derivation graph to
                  complement a static analysis modeling pointer permissions. Integrated the dynamic
                  analysis outputs into the static analysis, modeled pointer permissions for known
                  libc functions, and fixed how string literals and casts were analyzed.
                versions: [cv]
              - text: Wrote a rustc instrumentation plugin to dynamically trace pointer usage and
                  provenance throughout program runs, building a pointer derivation graph to
                  complement a static analysis modeling pointer permissions.
                versions: [general, software]
          - '[rav1d](https://github.com/memorysafety/rav1d):
            Ported the bulk of the AV1 decoder dav1d from C to Rust,
            translating complex C idioms while preserving performance, and extensively
            optimizing the result, including instrumenting and modifying rustc where it
            differed from C. The result is just 5% slower than C''s dav1d, 3.8% of which comes
            from the initial unsafe transpile.'
          - text: '[IA2](https://github.com/immunant/IA2-Phase2):
              Helped develop IA2, a tool for sandboxing intraprocess compartments from each
              other''s memory using x86_64''s Memory Protection Keys and Arm''s Memory Tagging
              Extension (MTE). Tested IA2 on dav1d, fixing bugs and adding features to handle a
              program as complex as dav1d, and added callgate data verification so data crossing
              the boundary between isolated compartments could be further verified.'
            versions: [cv, general, software]
      - company: MediaTek
        logo: mediatek.png
        position: '**Compiler Intern**'
        date:
        start_date: 2020-05
        end_date: 2021-12
        location: Woburn, MA
        summary:
        highlights:
