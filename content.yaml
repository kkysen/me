    summary:
      - Civic-minded systems engineer drawn to complex systems at every scale and across domains,
        from pure software like compilers and operating systems to real-world housing markets,
        the human endocrine system, and transit networks. I find where these systems interact and
        break down, and how they can be optimized for the benefit of all.
